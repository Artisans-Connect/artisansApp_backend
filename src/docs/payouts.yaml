openapi: 3.0.0
info:
  title: CraftMatch Payouts API
  version: 1.0.0
paths:
  /api/payouts/request:
    post:
      summary: Request a payout to MoMo or bank account
      tags: [Payouts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, channel, accountNumber, accountName]
              properties:
                amount:
                  type: number
                channel:
                  type: string
                  enum: [momo, bank]
                accountNumber:
                  type: string
                accountName:
                  type: string
                bankCode:
                  type: string
                  default: MTN
      responses:
        '200':
          description: Payout requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/payouts/history:
    get:
      summary: Get payout request history
      tags: [Payouts]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Payout history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data: {}
