name: Maintain OpenWiki documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    name: Refresh backend wiki
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out backend repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update OpenWiki
        run: npm run docs:wiki:update
        env:
          OPENWIKI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENWIKI_MODEL_ID: gemini-3.5-flash
          OPENWIKI_TELEMETRY_DISABLED: "1"
      - name: Create or update documentation pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki/
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: automation/openwiki-update
          delete-branch: true
          commit-message: "docs: update backend OpenWiki"
          title: "docs: update backend OpenWiki"
          body: |
            Automated backend-only documentation refresh.

            The wiki is deliberately scoped to this repository. Cross-repository
            behavior is labeled as an integration boundary rather than documented
            as product-wide fact.
          labels: |
            documentation
            automated
